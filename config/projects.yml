limits:
  max_file_bytes: 200000
  max_diff_chars: 120000
  max_context_chars: 160000
  max_tree_entries: 4000
  max_search_results: 200
  max_review_page_chars: 60000
  max_visual_file_bytes: 50000000
  max_pdf_pages: 2000
  max_render_pixels: 16000000
  min_visual_dpi: 72
  max_visual_dpi: 400
  default_visual_dpi: 180
  max_visual_image_bytes: 12000000
  max_office_output_bytes: 50000000
  render_timeout_seconds: 30
  max_cache_bytes: 500000000

local_artifacts:
  enabled: true
  root: /tmp

test_runner:
  enabled: true
  suites:
    beeagent_conversation_web:
      target: beeagent
      timeout_seconds: 90
    beeui_unit:
      target: beeui
      timeout_seconds: 90
    beescan_unit:
      target: beescan
      timeout_seconds: 90
    beemcp_unit:
      target: beemcp
      timeout_seconds: 180
  limits:
    cpu_percent: 100
    memory_mib: 768
    processes: 64
    file_mib: 16
    temp_mib: 64
    open_files: 256
    output_bytes: 16384

deny_paths:
  - ".env"
  - ".env.*"
  - "**/.env"
  - "**/.env.*"
  - "*.pem"
  - "**/*.pem"
  - "*.key"
  - "**/*.key"
  - "id_rsa"
  - "**/id_rsa"
  - "id_ed25519"
  - "**/id_ed25519"
  - ".git"
  - ".git/**"
  - "**/__pycache__/**"
  - ".venv/**"
  - "**/.venv/**"

projects:
  beemcp:
    source: ..
    base_branch: main
    github_repo: beesyst/beemcp
    context_modes:
      A:
        files:
          - README.md
          - server.py
          - start.sh
          - pyproject.toml
      B:
        extends: A
        files:
          - .gitignore
          - .env.example
          - config/projects.yml
          - config/start.py
          - ops/systemd/beemcp.service.in
          - ops/systemd/beemcp-tunnel.service.in
      C:
        extends: B
        tree_roots:
          - ops
          - tests

  beesdk:
    source: ../../beesdk
    base_branch: main
    github_repo: beesyst/beesdk
    context_modes:
      A:
        files:
          - README.ru.md
          - AGENTS.md
          - docs/ROADMAP.md
          - docs/SDLC.md
          - docs/SECURITY.md
          - docs/SPEC.md
          - .github/ISSUE_TEMPLATE/issue.md
          - .github/PULL_REQUEST_TEMPLATE/pr.md
      B:
        extends: A
        files:
          - pyproject.toml
          - CHANGELOG.md
          - docs/ARCHITECTURE.md
          - docs/DEV_GUIDE.md
      C:
        extends: B
        tree_roots:
          - src
          - tests
          - docs
          - .agents
    related:
      - project: beeagent
        files:
          - docs/ROADMAP.md
      - project: beeagent-rop
        files:
          - docs/ROADMAP.md

  beeagent:
    source: ../../beeagent
    base_branch: main
    github_repo: beesyst/beeagent
    context_modes:
      A:
        files:
          - README.ru.md
          - docs/ROADMAP.md
          - docs/SDLC.md
          - docs/SECURITY.md
          - docs/DEV_GUIDE.md
          - .github/ISSUE_TEMPLATE/issue.md
          - .github/PULL_REQUEST_TEMPLATE/pr.md
      B:
        extends: A
        files:
          - docs/product/ui_roadmap.md
          - docs/WEB_UI.md
          - pyproject.toml
          - config/start.py
          - config/settings.yml
          - src/beeagent_module/core/settings.py
          - src/beeagent_module/core/app.py
      C:
        extends: B
        tree_roots:
          - src
          - tests
          - config
          - docs
    related:
      - project: beeagent-rop
        files:
          - docs/ROADMAP.md

  beescan:
    source: ../../beescan
    base_branch: main
    github_repo: beesyst/beescan

    context_modes:
      A:
        files:
          - README.md
          - README.ru.md
          - AGENTS.md
          - docs/ROADMAP.md
          - docs/SDLC.md
          - docs/SECURITY.md
          - docs/SPEC.md
          - .github/ISSUE_TEMPLATE/issue.md
          - .github/PULL_REQUEST_TEMPLATE/pr.md

      B:
        extends: A
        files:
          - pyproject.toml
          - config/defaults.yml
          - docs/ARCHITECTURE.md
          - docs/DEV_GUIDE.md
          - docs/DATA_MODEL.md
          - docs/TOOLS.md
          - docs/WORKFLOWS.md
          - docs/adr/0001-beescan-architecture.md
          - src/beescan/module.py
          - src/beescan/domain/models.py
          - src/beescan/capabilities/catalog.py
          - .github/workflows/ci.yml
          - .github/workflows/release-please.yml
          - .github/release-please/config.json
          - .github/release-please/manifest.json

      C:
        extends: B
        tree_roots:
          - src
          - tests
          - config
          - docs
          - .agents
          - .github

    related:
      - project: beeagent
        files:
          - docs/ARCHITECTURE.md
          - docs/ROADMAP.md
          - src/beeagent_module/core/module_contract.py
          - src/beeagent_module/core/module_runtime.py
          - src/beeagent_module/core/module_registry.py
          - src/beeagent_module/core/capability_runtime.py

      - project: beesdk
        files:
          - docs/ARCHITECTURE.md
          - docs/SPEC.md
          - src/beesdk/modules.py
          - src/beesdk/artifacts.py
          - src/beesdk/capabilities.py

      - project: beeui
        files:
          - docs/ARCHITECTURE.md
          - docs/API_CONTRACT.md
          - docs/INTEGRATION.md

  beeagent-rop:
    source: ../../beeagent-rop
    base_branch: main
    github_repo: beesyst/beeagent-rop
    context_modes:
      A:
        files:
          - README.ru.md
          - docs/ROADMAP.md
          - docs/SDLC.md
          - docs/SECURITY.md
          - docs/SPEC.md
      B:
        extends: A
        files:
          - pyproject.toml
          - docs/DEV_GUIDE.md
          - docs/ARCHITECTURE.md
          - docs/CONTRIBUTING.md
      C:
        extends: B
        tree_roots:
          - src
          - config
          - docs
    related:
      - project: beeagent
        files:
          - docs/ROADMAP.md

  beedrill:
    source: ../../beedrill
    base_branch: main
    github_repo: beesyst/beedrill
    context_modes:
      A:
        files:
          - README.ru.md
          - AGENTS.md
          - docs/ROADMAP.md
          - docs/SDLC.md
          - docs/SECURITY.md
          - docs/SPEC.md
          - .github/ISSUE_TEMPLATE/issue.md
          - .github/PULL_REQUEST_TEMPLATE/pr.md

      B:
        extends: A
        files:
          - pyproject.toml
          - docs/ARCHITECTURE.md
          - docs/DEV_GUIDE.md

      C:
        extends: B
        tree_roots:
          - src
          - tests
          - docs
          - .agents

    related:
      - project: beesdk
        files:
          - docs/ROADMAP.md
          - docs/ARCHITECTURE.md
          - docs/SPEC.md
          - src/beesdk/__init__.py
          - src/beesdk/modules.py
          - src/beesdk/artifacts.py
          - src/beesdk/capabilities.py

      - project: beeagent
        files:
          - docs/ROADMAP.md
          - docs/DEV_GUIDE.md
          - src/beeagent_module/core/module_contract.py
          - src/beeagent_module/core/module_runtime.py
          - src/beeagent_module/core/module_registry.py

  beeui:
    source: ../../beeui
    base_branch: main
    github_repo: beesyst/beeui
    context_modes:
      A:
        files:
          - README.ru.md
          - docs/ROADMAP.md
          - docs/SDLC.md
          - docs/SECURITY.md
          - docs/SPEC.md
          - docs/API_CONTRACT.md
          - docs/COMPONENTS.md
          - docs/INTEGRATION.md
          - docs/WEB_UI.md
      B:
        extends: A
        files:
          - pyproject.toml
          - config/start.py
          - config/settings.yml
          - docs/ARCHITECTURE.md
          - docs/DEV_GUIDE.md
          - docs/vendor/tabler/
      C:
        extends: B
        tree_roots:
          - src
          - config
          - docs
          - tests

  beejsp:
    source: ../../beejsp
    base_branch: main
    github_repo: beesyst/beejsp

    context_modes:
      A:
        files:
          - README.md
          - AGENTS.md
          - docs/ROADMAP.md
          - docs/SECURITY.md
          - docs/FORMALIZATION.md
          - docs/SUBMISSION.md
          - .github/ISSUE_TEMPLATE/issue.md
          - .github/PULL_REQUEST_TEMPLATE/pr.md

      B:
        extends: A
        files:
          - pyproject.toml
          - CHANGELOG.md
          - docs/ARCHITECTURE.md
          - docs/DEV_GUIDE.md
          - scripts/sync_jsp_docs.sh
          - .github/workflows/ci.yml
          - .github/workflows/sync-jsp-docs.yml
          - .github/workflows/release-please.yml
          - .github/release-please/config.json
          - .github/release-please/manifest.json
          - docs/vendor/jsp/README.md
          - docs/vendor/jsp/UPSTREAM_REF
          - docs/vendor/jsp/UPSTREAM_COMMIT
          - docs/vendor/jsp/CONTRIBUTING.md
          - docs/vendor/jsp/docs/award-process.md
          - docs/vendor/jsp/docs/attribution.md
          - docs/vendor/jsp/docs/grading.md
          - docs/vendor/jsp/docs/records.md
          - docs/vendor/jsp/docs/verification.md
          - docs/vendor/jsp/problems/README.md
          - docs/vendor/jsp/skills/lean-verify/SKILL.md
          - docs/vendor/jsp/.github/ISSUE_TEMPLATE/claim-award.yml

      C:
        extends: B
        tree_roots:
          - src
          - tests
          - proofs
          - scripts
          - docs
          - .agents
