run_root: /home/bee/agent-runs
defaults:
  max_diff_chars: 80000
  max_file_bytes: 200000
  deny_paths:
  - .env
  - .env.*
  - '*.pem'
  - '*.key'
  - id_rsa
  - id_ed25519
  - .github/workflows/**
projects:
  mcp-demo:
    source: /home/bee/Pro/mcp-demo
    base_branch: main
    checks:
    - - git
      - diff
      - --check
    - - python3
      - -m
      - unittest
      - -q
  bee-dev-mcp:
    source: /home/bee/Pro/bee-dev-mcp
    base_branch: main
    checks:
    - - git
      - diff
      - --check
    - - uv
      - run
      - python
      - -m
      - py_compile
      - server.py
